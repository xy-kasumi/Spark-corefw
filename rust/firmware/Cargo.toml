[package]
name = "firmware"
version = "0.0.1"
edition = "2021"

[[bin]]
name = "firmware"
path = "src/main.rs"

[dependencies]
model = { path = "../model" }
embassy-stm32 = { version = "0.2", features = ["stm32h723ze", "memory-x", "time-driver-any"] }
embassy-executor = { version = "0.7", features = ["arch-cortex-m", "executor-thread"] }
embassy-time = { version = "0.4", features = ["tick-hz-1_000_000"] }
embassy-futures = "0.1"
embassy-sync = "0.7"
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
heapless = "0.8"
static_cell = "2"
